name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.11-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.11-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.11
          name: MagicXM4 v3.0.11 — 修断连开卡先撑高再缩回（离线形态回到数据层）
          body: |
            ## MagicXM4 3.0.11（回到数据层，叠在 3.0.10 之上）

            只修一件：XM4 未连接时点球展开卡片，卡片先撑成一张
            「底部大片空白」的高卡、再缩回正常高度。与图标无关
            （3.0.10 的图标机制本版未动）。

            根因：模块把球的 isOnline 强制为 true，宿主按在线形态
            装配整卡（含电量段/噪声段）；模块再在视图层事后隐藏
            （alpha 遮帧 + 多处 0~2000ms 的 postDelayed 反复清）。
            展开动画按装配时的高度先展开，隐藏陆续落地后又缩回
            ——视图层补救与动画赛跑，治不住。

            本版改法（回到数据层，与 postFixSections 同层）：
            - createEarphoneBatterySection / createEarphoneNoiseSection
              在「设备是 XM4 且真实离线」时直接返回 null：返回 null
              是宿主自身既有的退出形态（LinkDevice 为 null 时它就
              这么返回），宿主从一开始就不装配这两段；
            - postFixSections 离线兜底清扫：按 sectionType
              （EARPHONE_BATTERY / EARPHONE_NOISE）摘除残段；
            - 电量打桩与 setBatteryLevel 兜底替换改为只在真实连接
              时生效，离线不让断连前的残值电量复活；
            - 视图层赛跑补救整套删除：createDeviceServiceCard 的
              alpha 遮帧、createSections / attach /
              updateEarphoneUIByOnlineType 三处 postDelayed
              清理链。仅保留 createDeviceServiceCard 返回后一次
              同步 cleanupCard（只管响铃查找/自适应两行，不涉及
              电量/噪声段高度）。
            在线路径零改动：连接时电量段、噪声段、四档控制与
            3.0.10 完全一致。

            签名与 3.0.10 同证书（SHA-256: 62F45C54…8C55），可直接
            覆盖装。

            待真机验证：XM4 断开时点球展开，卡片点开就是正常
            高度（底部不再先出现大片空白再缩回）；连上 XM4 时
            电量/噪声控制如常。

          files: dist/*.apk
