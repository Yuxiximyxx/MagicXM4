name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.15-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.15-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.15
          name: MagicXM4 v3.0.15 — 球阵页按探针实况装门（球根 DeviceBallView + 名牌主判据）
          body: |
            ## MagicXM4 3.0.15（叠在 3.0.14 之上）

            3.0.14 探针已把全屏球阵页的实况钉死，本版按实况装门：

            - 球根类实测是 `DeviceBallView`，不是 3.0.13 findBallOf
              硬编码的 `BasicDeviceBallView` 全名——旧门在任何界面都
              找不到球根，这是 3.0.13 在球阵页漏换 XM4 的根因。
              本版放宽类名匹配（simpleName == DeviceBallView、类名以
              ".DeviceBallView" 结尾、或原 BasicDeviceBallView 全名，
              任一命中即认），深度上限 16（图标位到球根实测 5 层）。
            - 换图判据改以球根子树内的名牌 `device_ball_name` 文案
              == WH-1000XM4 为主判据（探针实测在 setImageDrawable
              时机可回读、能干净区分 XM4 与别家球），原 DeviceInfo
              判据为备；任一正向命中才在同一次设图调用内换成头戴图
              device_icon_default_earphone。名牌读不到/为空/别家名
              且 DeviceInfo 也不命中 → 原样放行；没有祖先的独立
              图标位（探针 root=none）同样放行。
            - 每次换图命中额外打一行归因日志（球名牌 + 来源入口），
              供下轮核对与 MagicPods 的交叉影响；3.0.14 探针保留、
              行为不变。

            其余全部不动：3.0.11 离线段否决、3.0.12 响铃摘除与入口
            跳板、文案门控保持原样；3.0.13 撤掉的全局 getDrawable
            hook 不复活。

            签名与 3.0.14 同证书（SHA-256: 62F45C54…8C55），可直接
            覆盖装。

            待真机验证：球阵页与下拉面板里 XM4 的球是头戴图、
            FreeBuds / Enco 的球保持耳塞图，两边都不再翻转。

          files: dist/*.apk
