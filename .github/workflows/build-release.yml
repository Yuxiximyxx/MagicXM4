name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.12-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.12-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.12
          name: MagicXM4 v3.0.12 — 删卡片响铃查找（连接/离线）+ 模块入口直达详情页
          body: |
            ## MagicXM4 3.0.12（叠在 3.0.11 之上）

            本版两项：

            ### ① 展开卡删掉「响铃查找」（连接和未连接的卡都删）

            WH-1000XM4 没有响铃查找功能，展开卡顶部那一行是荣耀按
            模板装配的。查清它在数据层的结构：它不是独立 section
            （createSections 只经 create*Section 生成电量/噪声两段，
            无生成方法可否决），而是混在某段 sectionDataList 里的
            一个 ServiceCardInfo 数据项（bsId 含 Find，即历史上
            FIX-006 把它置 NORMAL 放行可点的那一项）。

            改法：postFixSections 在 gen 返回后、卡片视图创建前，
            按 bsId 把该数据项整项摘除（不带连接态条件，连接/离线
            都摘；落地三档：数据列表原地改 → 段 setter → 段被摘空
            时整段移除，摘完回读计数打 diag 可查）。历史上「置
            NORMAL」的分支删除；视图层 cleanupCard 里按文案藏
            响铃行的整套逻辑（上两层定位 + diag 视图树 dump）一并
            清除，只保留「自适应」一颗按钮的隐藏。

            装配数据里从一开始就没有这一项，在线卡展开高度不会
            出现新的先大后小。

            ### ② 模块入口照 MagicPods 改成直达详情页

            - MainActivity 改为无界面跳板：onCreate 立即转发
              EarphoneDetailActivity 并 finish，不再渲染
              MagicXM4AppCompose 首页；
            - manifest 本就与 MagicPods 同构（LauncherActivity
              alias 已指向详情页、MODULE_SETTINGS 挂在
              MainActivity），未改动，两条入口现在都直达详情页；
            - 详情页「关于耳机」里的「模块设置」NavRow 一并去掉
              （跳板会把人绕回详情页本身，同 MagicPods 的处理）；
            - PopupActivity 保留不动：它仍在渲染首页 Compose，
              是全仓仅剩的一处引用，首页 Compose 不成死代码。

            其余全部不动：3.0.11 的离线电量/噪声否决、文案门控、
            球图标同步换图保持原样。

            签名与 3.0.11 同证书（SHA-256: 62F45C54…8C55），可直接
            覆盖装。

            待真机验证：连接与未连接两种展开卡上都没有「响铃
            查找」一行，其余行（电量/噪声/去连接·断开连接/更多
            设置）如常；点桌面图标或从 LSPosed 进模块设置都直达
            耳机详情页，不闪首页。

          files: dist/*.apk
