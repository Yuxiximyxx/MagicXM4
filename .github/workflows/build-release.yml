name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.17-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.17-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.17
          name: MagicXM4 v3.0.17 — 胶囊图标探针补灵敏度（只观察，不动文案）
          body: |
            ## MagicXM4 3.0.17（叠在 3.0.16 之上）

            本版只补胶囊图标探针的灵敏度，通知文案侧代码一个字未动。

            背景（16:05 真机 LSPosed 日志已钉死）：3.0.16 的通知修复
            其实已经生效——截图里那次「左耳 90% 右耳 --%」是 SystemUI
            旧进程里 3.0.15 时代旧代码的最后一次发作（16:04:42），
            3.0.16 新代码 16:04:45 已在新 SystemUI 进程装载完毕，
            只改占位标题 → 名字、绝不产生电量行。真正没解决的是
            胶囊图标：新进程里两个 ImageView 设图拦截全程零触发，
            说明胶囊图标位不是经 setImageResource / setImageDrawable
            设图的。

            - 新增整树探针（只观察、绝不换图）：胶囊的名牌与
              「已连接」文本必经 TextView.setText（旧改写实证命中
              过这一路），在此触发对锚点所在窗口整棵树的扫描
              （当前帧 + 150ms + 500ms 三帧）：树内同时有
              「已连接」与「WH-1000XM4」时，记录全部 ImageView
              的类名、图种类（耳塞 / 头戴 / 类名）、尺寸与祖先
              链；不齐时记录 nameFound / connectedFound 落空
              原因。结果仍落 magicxm4_diag_capsuleprobe 并打模块
              日志，签名去重、上限由 24 放宽到 40。目标：钉死
              胶囊图标位到底是什么 View、图是怎么交付的，下一版
              按实况装门。
            - 名牌后绑的延迟复核由单帧改多帧（当前帧 + 150ms +
              500ms），每帧落空都记一行原因（nameFound /
              connectedFound / 当前图类名）；换图判据与动作不变。

            其余全部不动：球图门、离线段否决、响铃摘除、入口
            跳板、通知文案（含 3.0.16 的名字行处理）保持原样；
            全局 getDrawable hook 不复活。

            签名与 3.0.16 同证书（SHA-256: 62F45C54…8C55），可
            直接覆盖装。装后须强停 SystemUI 宿主进程（或等其
            重启）才加载新代码。

            取证：装后连接 XM4 让胶囊出现一次即可，探针自动
            记录；之后导一份 LSPosed 日志（看「胶囊图标
            treeprobe」行）即可定位图标位。

          files: dist/*.apk
