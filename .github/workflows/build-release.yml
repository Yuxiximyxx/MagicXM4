name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.21-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.21-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.21
          name: MagicXM4 v3.0.21 — 窗口扫描探针（事件驱动取证，只记不换）
          body: |
            ## MagicXM4 3.0.21（叠在 3.0.20 之上）

            仍是纯取证版：只记不换。但换了取证方法 ——
            3.0.20 沿 ImageView.setImage* 入口蹲守「小胶囊
            探针」在真机零命中（新码确认在跑、展开卡那轮未
            出现），结论：收起态小胶囊的图不是经 setImage*
            递进来的（或连接瞬间模块的连接门未成立），蹲
            设图入口这条路走不通。

            本版改事件驱动 + 全窗口定版扫描（新探针
            「窗口扫描」，落键 magicxm4_diag_winprobe）：
            - 触发源：既有 A2DP 广播接收器的 CONNECTED
              分支（设备已过 isOriGPod 验明）与开机恢复
              路径，在连接事件后 800ms / 2500ms 各扫一次；
              同一轮连接只武装一次。
            - 扫描面：经 WindowManagerGlobal 枚举 SystemUI
              全部根视图逐棵 DFS，记录每颗 ImageView 的图
              种类（含耳塞同源判定）/ 尺寸 / 屏幕坐标 /
              祖先链，以及每棵树的 TextView 文本概览；
              耳塞同源图加 EARBUD 标记、屏幕顶部
              （y<200px）的图位加 TOP 标记 —— 收起态小
              胶囊就在状态栏顶部。
            - 结果分段写 magicxm4_diag_winprobe（带序号），
              并逐行打进 LSPosed 日志（标「▶ 窗口扫描」）；
              签名去重防刷屏。

            其余全部原样：animSwap / treeSwap 换图链、文案
            代码、setImage* 名牌门、既有探针一律不动；
            本版绝不改任何图标、任何文案。

            签名与 3.0.20 同证书（SHA-256: 62F45C54…8C55），
            可直接覆盖装。装后须强停 SystemUI 宿主进程才
            加载新代码；重连一次 XM4、让收起态小胶囊在
            顶部停留几秒，再导 LSPosed 日志看「▶ 窗口
            扫描」行即可钉死小胶囊图标位，下一版按实况
            装门。
          files: dist/*.apk
