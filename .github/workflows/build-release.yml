name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.24-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.24-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.24
          name: MagicXM4 v3.0.24 — 通知占位标题改写换名牌自证门
          body: |
            ## MagicXM4 3.0.24（叠在 3.0.23 之上）

            只修一件事：音频通知占位标题（「当前音频输入输出
            设备」）改写成 WH-1000XM4 的门。原门只有
            isXm4Connected()（connectedAddresses 非空），
            而该集合在 SystemUI 进程内不可靠 —— SystemUI
            被强停重启时 XM4 已连着、A2DP CONNECTED 广播
            不会重发，集合就一直空（3.0.22 winProbe 五轮扫
            描全被它误杀报 notConnected，同轮展开卡靠文本
            自证正常命中；MagicPods 同一道门已实锤害 Free4
            通知标题停在占位文案，v2.10.15 已去门修复）。

            但 XM4 不能照抄无条件改写：它写死 WH-1000XM4，
            无条件改会在 XM4 未连接、Free4 在用时把 Free4
            的通知标题抢成 WH-1000XM4（3.0.8 加门的原案）。
            故本版换「名牌自证门」，只动通知文案改写两处：

            - RemoteViews 路：先收集树内全部文案，门改为
              连接成立（gate=connected）或树内任一文案 ==
              WH-1000XM4（gate=namePlate，该通知正文本来
              就是设备名）；树里是别家设备名时不动。
            - TextView.setText 路：占位文案命中时门改为
              连接成立或 capsuleTreeContainsText 查到本树
              有 WH-1000XM4 名牌；当场没验到补延迟复核
              （0/150/500ms，仍是占位且树内已出现名牌才
              改，记 gate=deferred）。

            isXm4Connected 本体、状态栏图标链、winProbe
            （3.0.23 名牌门扫描，收起态小胶囊取证还要靠
            它）、capsule/treeSwap/animSwap/miniprobe 探
            针、其他 hook 一律未动。

            签名与 3.0.23 同证书（SHA-256: 62F45C54…8C55），
            可直接覆盖装。装后须强停「系统界面」进程才加
            载新代码，再重连 XM4 看音频通知标题。
          files: dist/*.apk
