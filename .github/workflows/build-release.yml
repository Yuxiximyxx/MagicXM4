name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/magicxm4.jks
          ls -lh signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.8-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.8-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.8
          name: MagicXM4 v3.0.8 — 通知串名门控；球/卡图标改走宿主原生头戴图
          body: |
            ## MagicXM4 3.0.8（全修版）

            本版修两件：

            ### 一、通知文案串名（连接门控）
            以前 SystemUI 文案改写不看当前连接设备：XM4 没连接时
            也会把音频通知的占位标题盖成 WH-1000XM4，抢掉同时在跑的
            MagicPods（Free4）的通知。本版给全部改写（RemoteViews
            树遍历 + TextView.setText 两条路径、占位→机型名与
            机型名→电量行两种改写）加门控：仅当 WH-1000XM4 是当前
            已连接的 A2DP 设备时才改写。门控信号用 SystemUI 进程内
            已有的 connectedAddresses（A2DP 广播 + 开机回补喂入、
            按设备名认定 XM4 本人），不新增跨进程键。

            ### 二、图标改走宿主原生头戴图（弃自绘）
            DSH 自绘的 ic_headphone 矢量图大小/位置/动画都与宿主
            原生对不上。实证（同机构建）：展开卡片卡头原生就是宿主
            的 device_icon_default_earphone（504×504 位图，画的正是
            头戴式）；设备球 initIcon 对第三方设备挑中的是耳塞家族图。
            本版：
            - 拆除 setImageDrawable/setImageResource 自绘替换 hook；
            - fixBallIcon 不再对展开卡片做任何覆盖（恢复宿主原生）；
            - 球只把 XM4 那颗球的图标换成宿主自带的
              device_icon_default_earphone（ConstantState 判定、
              不碰 bounds/scale），尺寸/位置/动画与原生头戴设备一致；
            - 删除模块自绘资源 ic_headphone.xml 与全部缩放逻辑
              （含 magicxm4_icon_scale 调节键）。

            ### ⚠️ 签名变更
            本版起改走 GitHub Actions 构建 + 新签名证书
            （SHA-256: 62F45C54…8C55），与 3.0.7 及以前 DSH 本地
            签名的版本证书不同。有核心破解可直接覆盖装；否则需先
            卸载旧版再装（设置会清零）。

            待真机验证：连上 XM4 看球与展开卡片的图标；XM4 未连接
            时连 Free4，音频通知标题应为 OPPO Enco Free4。
          files: dist/*.apk
