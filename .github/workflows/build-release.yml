name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.10-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.10-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.10
          name: MagicXM4 v3.0.10 — 修展开动画图标先变大再缩小（选图入口同步改结果）
          body: |
            ## MagicXM4 3.0.10（换机制修复，叠在 3.0.9 之上）

            只修一件：点球展开卡片时图标仍「先变大再缩小」
            （3.0.9 真机复验仍在，用户 12:09 录屏实证）。通知门控
            与其余逻辑与 3.0.9 一致，卡头继续零干预。

            根因（换机制）：3.0.8/3.0.9 的球图标靠 fixBallIcon
            视图树手术 + postDelayed（attach 的 0/120/400/1000ms、
            状态刷新的 0/150/500ms）在绘制后换 drawable。展开的
            morph 动画全程按宿主 BasicDeviceBallView.initIcon
            选定的图做测量与飞行，迟到的换图一律在飞行中被重新
            测量 —— 判定收窄到球本体、动画窗口跳过都堵不住，
            因为错的是换图时机本身。

            本版改法：hook 宿主自己的选图交付入口，在宿主取图的
            那一次调用内同步改结果，模块从不在绘制后换球的图：
            - ImageView.setImageResource(int)：图标位往上找到所属
              的球、是 XM4 的球时把入参的耳塞图 id 换成宿主头戴图
              device_icon_default_earphone 再 proceed（主路径）；
            - Resources.getDrawable(int)/(int,Theme) 与
              Context.getDrawable(int)：调用栈有 BasicDeviceBallView
              且在场球里有 XM4 的球时，同样换入参再 proceed。
            球的归属判定走它所持 DeviceInfo 的 MAC/名字（与模块
            注入的身份一致），文案 device_ball_name 只作兜底。
            fixBallIcon 本体与全部 postDelayed 换图触发已删除；
            装载时会把球的图标相关方法面打进 diag 备查
            （initicon_surface）。

            签名与 3.0.9 同证书（SHA-256: 62F45C54…8C55），可直接
            覆盖装。

            待真机验证：点球展开卡片，图标全程一个尺寸滑过去，
            不再先变大再缩小；球本身图标为宿主头戴图。

          files: dist/*.apk
