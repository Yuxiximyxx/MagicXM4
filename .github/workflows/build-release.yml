name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.22-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.22-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.22
          name: MagicXM4 v3.0.22 — 窗口扫描探针（武装改双路，只记不换）
          body: |
            ## MagicXM4 3.0.22（叠在 3.0.21 之上）

            仍是纯取证版：只记不换。本版**只改窗口扫描探针
            （winProbe）的武装方式**，扫描本体（全窗口 DFS
            与记录格式）一个字未动；animSwap / treeSwap /
            文案 / 名牌门全部原样。

            3.0.21 为何零产出（真机日志已判）：新码在跑、
            展开卡 animSwap 本轮正常命中，但 winProbe 零
            记录 —— 这轮连接全程抖动，A2DP 广播序列只有
            CONNECTING → DISCONNECTED → CONNECTING，
            日志窗口内从未出现 CONNECTED；而 3.0.21 的武
            装只挂在 CONNECTED 分支与开机恢复，两个武装
            点都没赶上（开机恢复武装时连接门不成立也会
            skip）。触发源选错，不是扫描坏了。

            本版武装改双路：
            - 主武装：挂到常驻的 TextView.setText 观察拦
              截上 —— SystemUI 里任意一次 setText 发生时，
              若距上次武装已超过 6 秒就武装一轮，扫描在
              约 300ms 后执行一次（扫描内部仍以 XM4 已
              连接为门，不成立记一行 skip 原因）。只要界
              面在动、XM4 连着，扫描必然周期性跑到，小
              胶囊在顶部停留期间必被扫中。
            - 副武装：A2DP 的 CONNECTING 分支也调
              winProbeSchedule（CONNECTED 分支与开机恢
              复保持原样），连接抖动期也能提前布防。
            - 每轮武装 / skip / 扫描都在 LSPosed 日志留
              可辨识标记（armed via=setText|a2dp），不再
              出现「零记录不知为何」的盲区。去重与总量
              上限沿用既有 WIN_SEEN 机制。

            签名与 3.0.21 同证书（SHA-256: 62F45C54…8C55），
            可直接覆盖装。装后须强停 SystemUI 宿主进程才
            加载新代码；重连 XM4、让收起态小胶囊在顶部
            停留几秒，再导 LSPosed 日志看「▶ 窗口扫描」
            行（重点找 EARBUD + TOP 标记）即可钉死小胶
            囊图标位，下一版按实况装门。
          files: dist/*.apk
