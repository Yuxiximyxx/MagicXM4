name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.13-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.13-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.13
          name: MagicXM4 v3.0.13 — 修球阵图标误伤：换图只认 XM4 本人的球
          body: |
            ## MagicXM4 3.0.13（叠在 3.0.12 之上）

            只修一个回归：设备中心球阵里所有耳机的球都被换成了
            头戴式图标（FreeBuds、Enco 的球也变头戴图，XM4 本人
            是对的）。

            ### 根因

            3.0.10 的换图挂了三个入口，其中 Resources.getDrawable
            与 Context.getDrawable 两层没有视图上下文，当年的作用域
            限定是「调用栈里有 BasicDeviceBallView + 在场登记表里
            有 XM4 的球」：球阵里 XM4 的球常驻在场，别家耳机的球
            取自己的耳塞图时栈上同样有 BasicDeviceBallView，两条
            限定全过 —— 三家耳机共用同一批耳塞图资源 id，于是
            谁取图都把结果换成头戴图。

            ### 修法

            - 撤掉 Resources.getDrawable（两个重载）与
              Context.getDrawable（ContextImpl / ContextWrapper）
              两层 hook，及其唯一用途的球构造登记表；
            - 换图只剩带 receiver 视图的两个入口：
              ImageView.setImageResource（主路径，原有）与
              ImageView.setImageDrawable（本版新增，兜住宿主先取图
              再 setDrawable 的路径；递进来的 Drawable 先按
              ConstantState 身份认出是耳塞两图之一）；
            - 两个入口都必须沿 ImageView 父链找到所属球根视图、
              读其所持 DeviceInfo，id 命中 XM4 的 MAC 或名字为
              WH-1000XM4 正向命中才换；认不出、读不到、非本人，
              一律原样放行 —— 宁可漏换，绝不再误伤。

            其余全部不动：3.0.11 的离线电量/噪声段否决、3.0.12 的
            响铃查找摘除与模块入口直达详情页、文案连接门控保持
            原样。

            签名与 3.0.12 同证书（SHA-256: 62F45C54…8C55），可直接
            覆盖装。

            待真机验证：球阵里 FreeBuds、Enco 的球恢复各自的耳塞
            图标，XM4 的球仍是头戴图；展开 XM4 卡片动画与离线
            高度如 3.0.11/3.0.12 不变。

          files: dist/*.apk
