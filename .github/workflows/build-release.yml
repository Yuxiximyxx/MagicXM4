name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.19-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.19-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.19
          name: MagicXM4 v3.0.19 — 胶囊图标翻到动效层（撤位图位换图）
          body: |
            ## MagicXM4 3.0.19（叠在 3.0.18 之上）

            胶囊图标二选一已由真机判完，本版按结论翻面；通知
            文案侧代码仍未动。

            判案证据（LSPosed_20261110_163239 + 16:32 截图）：
            3.0.18 的 treeSwap 在胶囊树（root=HnDynamicCardSetView、
            texts=[已连接, WH-1000XM4]）成功换掉了 140x140
            BitmapDrawable 位，但截图里胶囊左侧仍是入耳式图、
            右侧 90% 环内才是头戴小图 —— 那颗位图位不是可见
            左图（是环内小图/底图），可见左图只能是剩下唯一的
            候选：HnCardIconLayout 子树内的
            RemotableAnimationImageView（AnimatedImageDrawable，
            200x200），连接动画播完停在耳塞图那一帧。

            - 树扫描换图目标改到动效层：树验明（「已连接」+
              「WH-1000XM4」同树）后，在 HnCardIconLayout
              子树内取 drawable 为 AnimatedImageDrawable 的
              那颗（类名 RemotableAnimationImageView 优先），
              直接 setImageDrawable 换成头戴图
              device_icon_default_earphone（沿用
              loadCapsuleHeadphone）。
            - 防覆盖：slotRef 记住图位，三帧扫描兼作复核 ——
              后续帧发现它又被宿主重设回动画图，再换一次并
              记 animRebound；已是头戴图则收工。命中记
              animSwap（链 + 尺寸），落
              magicxm4_diag_capsuleprobe。
            - 140x140 位图位的换图撤掉：不再碰电量环内小图
              （它本来显示头戴小图就对）。
            - 不误伤：只有「已连接 + WH-1000XM4」同树才动手；
              Free4 的胶囊树（名牌 OPPO Enco Free4）天然不
              命中；其余通知树不碰。

            探针（treeprobe / treemiss / deferredMiss）与
            3.0.16 的 setImage* 图标门保留不动；球图门、离线
            段否决、响铃摘除、入口跳板、通知文案保持原样；
            全局 getDrawable hook 不复活。

            签名与 3.0.18 同证书（SHA-256: 62F45C54…8C55），可
            直接覆盖装。装后须强停 SystemUI 宿主进程（或等其
            重启）才加载新代码。

          files: dist/*.apk
