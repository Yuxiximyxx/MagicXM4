name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.23-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.23-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.23
          name: MagicXM4 v3.0.23 — 窗口扫描探针（连接门换名牌门，只记不换）
          body: |
            ## MagicXM4 3.0.23（叠在 3.0.22 之上）

            仍是纯取证版：只记不换。本版**只改窗口扫描探针
            （winProbe）的连接门**，扫描本体（全窗口 DFS
            与记录格式）未动；animSwap / treeSwap /
            treeprobe / miniprobe / 文案 / 名牌门全部原样，
            isXm4Connected 本身与它的其他使用点（文案改
            写、状态栏图标链）一律不动。

            3.0.22 为何仍零产出（真机日志已判）：setText
            主武装工作正常（5 轮 armed via=setText），但
            每轮扫描都被入口的 isXm4Connected() 硬门
            skip（reason=notConnected，conn=false）；同轮
            展开卡 treeprobe 命中 [已连接, WH-1000XM4]、
            animSwap 成功换图 —— XM4 明明连着。根源：
            该门读的 connectedAddresses 在 SystemUI 本
            进程恒空（维护回调不在本进程生效），扫描是
            被自家的连接门误杀的。

            本版改法：
            - winProbeScan 入口硬门拆除，换「名牌门」：
              先枚举全部根视图做轻量文本预检，任一棵树
              含 WH-1000XM4（或 已连接）即放行全量扫描
              并记 gate=nameFound；一棵都没有才 skip，
              skip 行记 reason=noNamePlate 并附各树 root
              类名概览。
            - 开机恢复武装路径的连接预检一并拆除，武装
              侧不再预杀（扫描内部已有名牌门）。

            签名与 3.0.22 同证书（SHA-256: 62F45C54…8C55），
            可直接覆盖装。装后须强停 SystemUI 宿主进程才
            加载新代码；重连 XM4、让收起态小胶囊在顶部
            停留几秒，再导 LSPosed 日志看「▶ 窗口扫描」
            行（重点找 EARBUD + TOP 标记）即可钉死小胶
            囊图标位，下一版按实况装门。
          files: dist/*.apk
