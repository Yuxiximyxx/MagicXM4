name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.18-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.18-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.18
          name: MagicXM4 v3.0.18 — 胶囊图标按探针实况换图（树扫描换位图位）
          body: |
            ## MagicXM4 3.0.18（叠在 3.0.17 之上）

            本版按 3.0.17 探针钉死的实况修灵动岛胶囊图标；通知
            文案侧代码一个字未动（正文问题已结案：16:20 真机
            胶囊只剩「已连接 / WH-1000XM4」与 90% 电量环）。

            探针实况（LSPosed_20261110_162108，16:20:40，
            SystemUI）：命中树 root=HnDynamicCardSetView、
            texts=[已连接, WH-1000XM4]；树内设备图位是
            HnCardLayout 子树里一颗 BitmapDrawable 140x140 的
            ImageView —— 位图交付，所以 entry 名 /
            ConstantState 两种认图全落空、setImage* 拦截也逮
            不到交付时机（宿主先解码成 Bitmap 再交付）。

            - 新增「胶囊树扫描换图」：锚点沿用探针同款
              TextView.setText 观察（名牌 /「已连接」出现时），
              对锚点所在窗口整棵树三帧扫描（当前帧 + 150ms +
              500ms，与探针同节奏）；树内同时有「已连接」与
              「WH-1000XM4」验明后，在 HnCardLayout 子树内找
              BitmapDrawable 且 intrinsic 约 140x140 的那颗
              ImageView，把图换成头戴图
              device_icon_default_earphone（资源加载沿用既有
              loadCapsuleHeadphone 逻辑）。命中打一行 treeSwap
              日志（含图位祖先链与换前尺寸），仍落
              magicxm4_diag_capsuleprobe。
            - 只换这一颗位图位：同树的 RemotableAnimationImageView
              （200x200，疑似动效层）只记进日志对照、本版不动
              —— 若真机换完仍是耳塞图，下一轮按日志翻它。
            - 不误伤：只有「已连接 + WH-1000XM4」同树才动手；
              Free4 的胶囊树（名牌 OPPO Enco Free4）天然不
              命中；其余通知树不碰。

            探针（treeprobe / treemiss / deferredMiss）与
            3.0.16 的 setImage* 图标门保留不动；球图门、离线
            段否决、响铃摘除、入口跳板、通知文案保持原样；
            全局 getDrawable hook 不复活。

            签名与 3.0.17 同证书（SHA-256: 62F45C54…8C55），可
            直接覆盖装。装后须强停 SystemUI 宿主进程（或等其
            重启）才加载新代码。

          files: dist/*.apk
