name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.14-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.14-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.14
          name: MagicXM4 v3.0.14 — 全屏球阵页球图定位探针（只观察不改图）
          body: |
            ## MagicXM4 3.0.14（叠在 3.0.13 之上）

            本版不改任何图标行为，只装定位探针：3.0.13 已确认下拉
            面板的球正常（FreeBuds / Enco 恢复耳塞图、XM4 是头戴图），
            但全屏球阵页里 XM4 的球变回了耳塞图——那一页里耳塞图递进
            图标位的调用没被 3.0.13 的门逮住，球根的确切类名/层级在
            静态材料里定不了。

            ### 本版做了什么

            - 在既有的 ImageView.setImageResource / setImageDrawable
              两入口旁挂只观察的记录：耳塞图递进图标位时，把图标位
              的祖先链类名序列、球根命中形态、球名牌文案打进模块
              日志与 Settings.Global（magicxm4_diag_gridprobe）；
            - 另挂 TextView.setText 名牌锚点：设备名出现时记录名牌
              的祖先链（名牌必然长在球身上，是球根形状的硬证据）；
            - 探针只记不改：不换任何图、不动任何返回值，控制面与
              3.0.13 逐行一致；3.0.13 撤掉的全局 getDrawable hook
              不复活。

            其余全部不动：3.0.11 离线段否决、3.0.12 响铃摘除与入口
            跳板、文案门控、面板侧球图门保持原样。

            签名与 3.0.13 同证书（SHA-256: 62F45C54…8C55），可直接
            覆盖装。

            待真机取证：装后打开全屏球阵页一次即可（探针自动记录），
            随后导出 LSPosed 日志或读 magicxm4_diag_gridprobe /
            magicxm4_diag_gridprobe_name 两个值，下一版按实况装门。

          files: dist/*.apk
