name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.9-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.9-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.9
          name: MagicXM4 v3.0.9 — 修断开态展开卡片卡头图标被误换成写实大图
          body: |
            ## MagicXM4 3.0.9（回归修复，叠在 3.0.8 之上）

            只修一件 3.0.8 的回归，其余逻辑与 3.0.8 完全一致：

            真机录屏实证：点球展开卡片时，卡头图标会先变大、再缩回
            正常（动画中途跳变）；XM4 未连接时展开的卡片里还会留下
            一张白色写实头戴大图（与卡面风格不符）。

            根因：展开走 morph 动画，而 createDeviceCard 的 0ms 与
            后续 postDelayed 触发点正落在动画窗口内；3.0.8 的
            fixBallIcon 从 rootView 全树遍历所有 icon_image_view，
            其归属判定 belongsToOurBall 同时认球名
            （device_ball_name）和卡头名（device_name）——卡头那张图
            的 ImageView 与卡头 device_name 在同一子树，于是被误判
            成「球的图标」，在动画中途被换成
            device_icon_default_earphone 的原始 504 位图且不设
            bounds/scaleType：图标先骤然变大，随后宿主重新测量、
            动画收束又缩回 —— 就是录屏里的「先变大再变小」；
            断开态卡片布局下还会静态撑成写实大图，把 3.0.8「卡头
            完全恢复宿主原生、零干预」的方针架空了。（连接态终态
            观感正常只是该位图被在线布局的容器约束住了。）

            修法（两层）：
            - belongsToOurBall 锚点只认 device_ball_name；往上找时
              若先遇到 device_name（卡片子树特征）直接判否。
            - 动画保险：作用域里已出现我方展开卡
              （device_name == WH-1000XM4）时，本轮 fixBallIcon
              整体跳过 —— 动画窗口内一张图都不换。球的图标在点开
              之前早已换好，不依赖动画中途的调用。
            卡头从此真正零干预，球的换图逻辑不变。

            签名与 3.0.8 同证书（SHA-256: 62F45C54…8C55），可直接
            覆盖装。

            待真机验证：点球展开卡片，图标全程尺寸稳定、不再先
            变大再缩回；XM4 未连接时展开服务卡，卡头应为宿主原生
            的小图样式，不再是写实大图。
          files: dist/*.apk
