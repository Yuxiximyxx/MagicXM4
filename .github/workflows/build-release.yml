name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.1.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.1.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0
          name: MagicXM4 v3.1.0 — 耳机详情页迁 MIUIX（工具链对齐 + Miuix 真组件）
          body: |
            ## MagicXM4 3.1.0（叠在 3.0.24 之上）

            耳机详情页迁移到 MIUIX，与 MagicPods v2.11.0
            同一配方：工具链对齐 AGP 9.1.1 / Kotlin
            2.4.10 / Compose BOM 2026.05.00 / Gradle
            9.3.1 / compileSdk 36，接入 Miuix-KMP
            0.8.8。主题换 MiuixTheme，骨架换 Scaffold +
            SmallTopAppBar，分区换 Card + SmallTitle，
            导航/开关/信息行换 SuperArrow / SuperSwitch /
            BasicComponent，滑杆与弹窗换 Miuix Slider /
            WindowDialog；自绘电量环与降噪分段保留原绘
            制。功能与数据流零变化，hooks/协议/winProbe
            等探针逐行未动。

            签名与 3.0.24 同证书（SHA-256: 62F45C54…
            8C55），可直接覆盖装。详情页视觉变化请到
            详情页目检。
          files: dist/*.apk
