name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICXM4_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "MAGICXM4_KEYSTORE_BASE64 未配置"; exit 1; fi
          mkdir -p app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing/magicxm4.jks
          ls -lh app/signing/magicxm4.jks

      - name: Build release
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/MagicXM4-3.0.20-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/MagicXM4-3.0.20-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magicxm4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.20
          name: MagicXM4 v3.0.20 — 小胶囊探针（纯取证，只记不换）
          body: |
            ## MagicXM4 3.0.20（叠在 3.0.19 之上）

            纯取证版：只记不换。目标是钉死「收起态小胶囊」
            的图标位。

            背景：v3.0.19 已由真机确认修好胶囊展开卡
            （HnDynamicCardSetView 树）的图标 —— animSwap 把
            HnCardIconLayout 内 RemotableAnimationImageView
            （AnimatedImageDrawable，200x200）换成头戴图
            生效，本版不许动这条链。剩下的问题是收起态：
            状态栏顶部那条小黑胶囊（左侧小耳塞图标 + 右侧
            电量环）的左图仍是入耳式；它不在展开卡树里
            （没有「已连接 / WH-1000XM4」文本锚点），是另一
            套视图，位置与图位都未知。

            本版新增「小胶囊探针」（只观察，绝不改图/改文案）：
            - 设图入口采样：XM4 已连接时，ImageView 的
              setImageResource / setImageDrawable 入参被认出
              是耳塞家族图（entry 名命中现有名单，或
              ConstantState 同源）即记一行 —— 图名 /
              drawable 类名、视图类名与 id 名、祖先链
              （≤16 层）、视图尺寸；签名去重、上限放宽到
              120，落新键 magicxm4_diag_miniprobe，日志标
              「▶ 小胶囊探针」。
            - 被动树扫描：既有 setText 锚点触发、且所在树
              root 不是 HnDynamicCardSetView 时，若树内有
              耳塞图 ImageView，记一行 root 类名 + 全树
              ImageView 概览（类名/图种类/尺寸/id）。

            其余全部原样：animSwap / treeSwap 换图链、文案
            代码、setImage* 名牌门、展开卡探针一律不动；
            全局 getDrawable hook 不复活。

            签名与 3.0.19 同证书（SHA-256: 62F45C54…8C55），
            可直接覆盖装。装后须强停 SystemUI 宿主进程（或
            等其重启）才加载新代码；重连 XM4 让收起态小胶囊
            出现一次，再导 LSPosed 日志看「▶ 小胶囊探针」行
            即可定位图标位，下一版按实况装门。

          files: dist/*.apk
